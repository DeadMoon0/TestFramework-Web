name: Unit Tests

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore test project
        run: dotnet restore UnitTests/TestFramework.Web.Tests/TestFramework.Web.Tests.csproj

      - name: Run unit tests
        run: dotnet test UnitTests/TestFramework.Web.Tests/TestFramework.Web.Tests.csproj --configuration Release --no-restore --filter "Category!=WindowsOnly&Category!=SqlServer" --logger "trx"

  # The shipped ADO.NET executor only runs against a real server, so this leg gives it one. The password is
  # for a container that exists for the length of this job and is reachable from nowhere else.
  sql-server:
    name: sql-server
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci-Only-2026!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ci-Only-2026!' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      TESTFRAMEWORK_WEB_SQL: "Server=localhost,1433;Database=master;User ID=sa;Password=Ci-Only-2026!;TrustServerCertificate=true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore test project
        run: dotnet restore UnitTests/TestFramework.Web.Tests/TestFramework.Web.Tests.csproj

      - name: Run SQL Server tests
        run: dotnet test UnitTests/TestFramework.Web.Tests/TestFramework.Web.Tests.csproj --configuration Release --no-restore --filter "Category=SqlServer" --logger "trx"
